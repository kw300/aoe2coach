[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aoe2coach"
version = "0.1.0"
description = "An AI coach for Age of Empires II: Definitive Edition replays, powered by a bring-your-own model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "aoe2coach contributors" }]
keywords = ["age-of-empires", "aoe2", "replay", "coaching", "llm", "openai", "anthropic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Games/Entertainment :: Real Time Strategy",
]

dependencies = [
    # Default model provider. The OpenAI-compatible provider is available via [openai].
    "anthropic>=0.40",
    # Loads model-provider keys from a local .env during development (never committed).
    "python-dotenv>=1.0",
    # NOTE: the replay parser is NOT here — pick a backend extra below. `mgz` and
    # `mgz-fast` both install as the `mgz` module and cannot coexist.
]

[project.optional-dependencies]
# Rich narratives: named build orders, villager production, age uptimes, EAPM, the
# real winner, map terrain, located objects. Parses DE replays up to ~v66.x
# (pre-"Last Chieftains", before Feb 2026). Install this for analyzing pro/tournament
# games and the bundled fixtures.
full = ["mgz>=1.8"]
# Current game patch: the AoEInsights fork keeps pace with new versions (full mgz
# cannot — see CLAUDE.md / aoc-mgz #138). Install this to analyze your OWN recent
# games. Lower-level: some rich fields are unavailable.
fast = ["mgz-fast @ git+https://github.com/AoEInsights/aoc-mgz.git"]
openai = ["openai>=1.40"]      # use GPT / OpenRouter / local models (BYO-model)
mcp = ["mcp>=1.0"]
viz = ["pillow>=10"]            # minimap rendering (needs the full backend too)
web = ["flask>=3"]             # local replay-browser front end
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.5",
]

[project.scripts]
aoe2coach = "aoe2coach.cli:main"
aoe2coach-mcp = "aoe2coach.mcp_server:main"

[project.urls]
Homepage = "https://github.com/kw300/aoe2coach"
Issues = "https://github.com/kw300/aoe2coach/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aoe2coach"]

[tool.hatch.metadata]
# Required to allow the git+https dependency above.
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Inline HTML/CSS templates have unavoidably long lines.
"src/aoe2coach/webapp.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
